<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./trophy.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
       <!-- iOS Home Screen icon (PNG recommended) -->
       <link rel="apple-touch-icon" href="./trophy-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FutebolSort" />
    <title>FutebolSort</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Use production manifest when building for prod
      const link = document.querySelector('link[rel="manifest"]');
      if (link && import.meta.env.MODE === 'production') {
        link.href = import.meta.env.BASE_URL + 'manifest.prod.json';
      }

      if ('serviceWorker' in navigator) {
        const swUrl = import.meta.env.BASE_URL + 'service-worker.js';
        navigator.serviceWorker.register(swUrl).catch(() => {
          // Quietly ignore registration errors in production; use dev tools if needed
        });
      }
    </script>
  </body>
</html>
